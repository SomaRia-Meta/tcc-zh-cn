name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 语法检查
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n tools/make-dist.sh
          bash -n tools/build-zh-bundle.sh
          python3 -m py_compile lib/asar_extract.py lib/patch_bundles.py

      - name: 打包 deb / tar.gz
        run: make dist

      - name: 上传构建产物（手动触发时）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tcc-zh-cn-packages
          path: dist/*

      - name: 创建 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
